services:
  - type: web
    name: safebite-ai-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
      - key: ENABLE_LABEL_REGION_DETECTION
        value: "false"
      - key: ML_CONTAINER_URL
        sync: false
      - key: ML_CONTAINER_API_KEY
        sync: false
